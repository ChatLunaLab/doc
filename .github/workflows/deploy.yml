name: deploy

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate Yarn
        run: corepack enable

      - run: yarn install --immutable
        name: Install dependencies

      - name: Build v2 and v1
        run: yarn build:all
      - name: Check builds
        run: yarn test:build

      # chatluna.chat is served by this repository's Pages site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload v2 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/.vitepress/dist"
      - name: Deploy v2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # v1.chatluna.chat is served by the Pages site of ChatLunaLab/doc-v1
      - name: Deploy v1 to ChatLunaLab/doc-v1
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOC_V1_DEPLOY_KEY }}
          external_repository: ChatLunaLab/doc-v1
          publish_branch: gh-pages
          publish_dir: docs/.vitepress/dist-v1
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

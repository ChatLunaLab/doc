approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# TypeScript 7 drops the JS compiler API that twoslash needs.
packageExtensions:
  "twoslash@*":
    dependencies:
      typescript: ^6.0.3
  "twoslash-vue@*":
    dependencies:
      typescript: ^6.0.3
  "@shikijs/twoslash@*":
    dependencies:
      typescript: ^6.0.3
  "@typescript/vfs@*":
    dependencies:
      typescript: ^6.0.3
